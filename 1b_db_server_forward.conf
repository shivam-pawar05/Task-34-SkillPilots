# STEP 1 (cont.) - /etc/rsyslog.d/30-postgres-forward.conf on the DATABASE server
# Forwards PostgreSQL's LOCAL0 messages to the central collector over TCP.
# Replace collector.example.com with the real collector host name or IP.
# Apply:  sudo rsyslogd -N1 && sudo systemctl restart rsyslog

if $syslogfacility-text == 'local0' then {
    action(type="omfwd"
           target="collector.example.com" port="514" protocol="tcp"
           queue.type="LinkedList" queue.filename="fwd_postgres" queue.maxDiskSpace="500m"
           queue.saveOnShutdown="on" action.resumeRetryCount="-1")   # disk queue: no loss if collector is briefly down
}
# One-line alternative:  local0.*  @@collector.example.com:514      (@@ = TCP, @ = UDP)
