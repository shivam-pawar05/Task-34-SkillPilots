# STEP 1 - Add to postgresql.conf on the DATABASE server
# (Debian/Ubuntu: /etc/postgresql/<ver>/main/postgresql.conf, RHEL: /var/lib/pgsql/<ver>/data/postgresql.conf)

log_destination      = 'syslog'          # send server log to syslog (can be 'syslog,stderr' to keep the file too)
syslog_facility      = 'LOCAL0'          # facility used by the rsyslog rules below
syslog_ident         = 'postgres'        # program name seen by rsyslog ($programname)
syslog_sequence_numbers = on             # adds [seq-line] so multi-line statements can be re-joined
syslog_split_messages   = on

log_statement        = 'ddl'             # log CREATE / ALTER / DROP ... (the compliance requirement)
log_line_prefix      = 'user=%u,db=%d,app=%a,client=%h '   # WHO did it; the report script depends on this exact format
log_connections      = on
log_disconnections   = on

# Apply without restart:   sudo -u postgres psql -c "SELECT pg_reload_conf();"
# Test:                    sudo -u postgres psql -c "CREATE TABLE audit_test(id int); DROP TABLE audit_test;"
