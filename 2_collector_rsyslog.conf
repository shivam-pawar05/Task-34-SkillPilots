# STEP 2 - /etc/rsyslog.d/10-postgres-collector.conf on the REMOTE COLLECTOR server
# Install:  sudo apt install rsyslog        (RHEL/CentOS: sudo dnf install rsyslog)
# Then:     sudo mkdir -p /var/log/remote/postgres && sudo chown syslog:adm /var/log/remote/postgres
#           sudo rsyslogd -N1 && sudo systemctl enable --now rsyslog && sudo systemctl restart rsyslog
#           sudo ufw allow from <db-server-ip> to any port 514 proto tcp     # only allow your DB servers!

module(load="imtcp")
input(type="imtcp" port="514" ruleset="postgres_remote")

# One file per sending host (ISO timestamps via RSYSLOG_FileFormat - the report script parses this)
template(name="PgPerHost" type="string" string="/var/log/remote/postgres/%HOSTNAME%.log")

# PostgreSQL log source: anything whose program name is 'postgres'
ruleset(name="postgres_remote") {
    if $programname == 'postgres' then {
        action(type="omfile" dynaFile="PgPerHost" template="RSYSLOG_FileFormat"
               dirCreateMode="0750" fileCreateMode="0640")
    }
    stop   # keep remote messages out of the collector's own /var/log/syslog
}
